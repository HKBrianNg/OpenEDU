# GitHub Actions CI
# 触发：push 到 main、或对 main 的 PR
# 内容：client 端 lint + test + build（worker 端暂未加测试，按需扩展）

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支的新 push 自动取消上一次仍在跑的 CI，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client (lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
